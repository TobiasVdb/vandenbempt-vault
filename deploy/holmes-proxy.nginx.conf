# Installed as /etc/nginx/sites-available/holmes on the AV droplet.
# Rewrite only this site's own Origin; cross-origin requests remain rejectable upstream.
map $http_origin $holmes_upstream_origin {
    default $http_origin;
    "https://holmes.planetarypixel.be" "https://houseoftobias-lyb5w.ondigitalocean.app";
}

server {
    listen 80;
    server_name holmes.planetarypixel.be;
    location ^~ /.well-known/acme-challenge/ { root /var/www/holmes-acme; }
    location / { return 308 https://holmes.planetarypixel.be$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name holmes.planetarypixel.be;
    ssl_certificate /etc/letsencrypt/live/holmes.planetarypixel.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holmes.planetarypixel.be/privkey.pem;

    client_max_body_size 7m;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host houseoftobias-lyb5w.ondigitalocean.app;
    proxy_set_header Origin $holmes_upstream_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /haw /;
    proxy_redirect https://houseoftobias-lyb5w.ondigitalocean.app/haw/ /;
    proxy_redirect /haw/ /;

    location = /cms { return 308 /cms/; }
    location /cms/ { proxy_pass https://houseoftobias-lyb5w.ondigitalocean.app/haw/admin/; }
    location = /house-admin { return 308 /house-admin/; }
    location /house-admin/ { proxy_pass https://houseoftobias-lyb5w.ondigitalocean.app/; }
    location /__house/ { proxy_pass https://houseoftobias-lyb5w.ondigitalocean.app; }
    location / { proxy_pass https://houseoftobias-lyb5w.ondigitalocean.app/haw/; }
}
