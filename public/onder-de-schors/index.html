<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onder de Schors</title>
<link rel="stylesheet" href="./menu.css">
<script type="module" src="./menu.js?v=3571435"></script>
</head>
<body>
<main class="title-screen" aria-label="Onder de Schors">
  <div id="scene" class="scene" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <svg class="health" viewBox="0 0 86 10" role="img" aria-label="Levens: 5 van 5">
    <defs>
      <path id="heart" fill="#ea3548" d="M2 0h3v1h1v1h2V1h1V0h3v1h1v1h1v4h-1v1h-2v1H9v1H8v1H6V9H5V8H3V7H1V6H0V2h1V1h1z"/>
    </defs>
    <use href="#heart"/>
    <use href="#heart" x="18"/>
    <use href="#heart" x="36"/>
    <use href="#heart" x="54"/>
    <use href="#heart" x="72"/>
  </svg>
  <div class="controls" id="controls" hidden>
    <button type="button" id="play-sequence">Speel animatieproef</button>
    <div class="touch-controls" aria-label="Aanraakbediening">
      <div class="touch-group">
        <button type="button" data-direction="left" aria-label="Naar links">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
        </button>
        <button type="button" data-direction="right" aria-label="Naar rechts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
      <div class="touch-group">
        <button type="button" data-action="jump" aria-label="Springen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14"/></svg>
        </button>
        <button type="button" data-action="hit" aria-label="Slaan" aria-description="Houd ingedrukt om je zwaard te trekken.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 15 6-7V4h-4l-7 6m-2-2 9 9m-6-6-6 6a2 2 0 0 0 3 3l6-6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-mark" aria-hidden="true">∞</div>
    <p role="status">De wereldboom laden…</p>
    <div class="loading-track" aria-hidden="true"></div>
  </div>
  <p class="status" id="status" role="status" hidden></p>
</main>
</body>
</html>
